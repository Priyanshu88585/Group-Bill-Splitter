<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <title>Group Bill Splitter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; }
        /* Zebra rows for settlement table */
        #settlementTable tbody tr:nth-child(even) { background-color: #f8fafc; }
        .dark #settlementTable tbody tr:nth-child(even) { background-color: #0f172a; }
    </style>
</head>

<body class="bg-gradient-to-br from-amber-50 via-white to-emerald-50 dark:from-slate-900 dark:via-slate-950 dark:to-slate-900 min-h-screen p-6 transition-colors">

    <main class="relative bg-white/80 dark:bg-slate-900/70 ring-1 ring-black/5 dark:ring-white/10 shadow-xl rounded-2xl p-6 md:p-8 w-full max-w-3xl mx-auto space-y-6">

        <!-- ====== Header ====== -->
        <header class="relative">
            <button type="button" onclick="toggleTheme()" class="absolute right-0 -top-2 inline-flex items-center gap-2 rounded-full border border-slate-200 dark:border-slate-700 px-3 py-1.5 text-xs text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition">🌙</button>
            <h1 class="text-3xl md:text-4xl font-bold text-center tracking-tight text-emerald-600 dark:text-emerald-400">Group Bill Splitter</h1>
            <p class="mt-1 text-center text-sm text-slate-600 dark:text-slate-300">Split expenses fairly among friends</p>
        </header>

        <!-- ====== Currency Selector ====== -->
        <section>
            <label class="block mb-1 font-medium text-slate-700 dark:text-slate-200">Select Currency</label>
            <select id="currency" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500/70 transition">
                <option value="₹">₹ - INR</option>
                <option value="$">$ - USD</option>
                <option value="€">€ - EUR</option>
                <option value="£">£ - GBP</option>
            </select>
        </section>

        <!-- ====== People Count Input ====== -->
        <section>
            <label class="block mb-1 mt-3 font-medium text-slate-700 dark:text-slate-200">How many people?</label>
            <div class="flex items-center gap-2">
                <button type="button" onclick="decrementPeople()" class="h-10 w-10 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition">−</button>
                <input id="peopleCount" type="number" min="1" class="flex-1 w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/70" placeholder="e.g. 3">
                <button type="button" onclick="incrementPeople()" class="h-10 w-10 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition">+</button>
            </div>
            <button onclick="generateNameInputs()" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-4 py-2 w-full mt-2 transition">Next</button>
        </section>

        <!-- ====== Names Input ====== -->
        <section>
            <form id="namesForm" class="space-y-3 hidden">
                <div id="nameFields" class="space-y-3"></div>
                <button type="button" onclick="generatePurposeInputs()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 w-full transition">Next</button>
            </form>
        </section>

        <!-- ====== Purpose Input ====== -->
        <section>
            <form id="paymentForm" class="space-y-3 hidden">
                <div class="flex justify-between items-center">
                    <label class="block font-semibold text-lg text-slate-800 dark:text-slate-100">Enter Purpose, Category & Payments</label>
                </div>
                <div id="purposeFields" class="space-y-3"></div>

                <!-- ====== Buttons in Same Line ====== -->
                <div class="flex justify-between items-center gap-2">
                    <button type="button" onclick="showResult()" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-4 py-2 flex-1 transition">Show Result</button>
                    <button type="button" onclick="addPurposeBox()" class="bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-black dark:text-white rounded-full w-10 h-10 flex items-center justify-center text-xl transition">+</button>
                </div>
            </form>
        </section>


        <!-- ====== Result ====== -->
        <section id="result" class="hidden space-y-3">
            <h2 class="text-xl font-bold text-center text-emerald-600 dark:text-emerald-400">Final Settlement</h2>

            <div class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                <div id="totalPaid" class="text-left text-slate-800 dark:text-slate-100"></div>
                <select id="categoryFilter" onchange="calculateSettlement()" class="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/70 transition">
                    <option value="all">All Categories</option>
                </select>
            </div>

            <div class="overflow-hidden rounded-lg border border-slate-200 dark:border-slate-700 mt-2">
                <table class="w-full text-sm" id="settlementTable">
                    <thead class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                        <tr>
                            <th class="border border-slate-200 dark:border-slate-700 p-2">Person</th>
                            <th class="border border-slate-200 dark:border-slate-700 p-2">Paid</th>
                            <th class="border border-slate-200 dark:border-slate-700 p-2">Share</th>
                            <th class="border border-slate-200 dark:border-slate-700 p-2">Balance</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <h3 class="text-lg font-semibold text-center mt-6 text-slate-800 dark:text-slate-100">Who Owes Whom</h3>
            <ul id="owedList" class="list-disc list-inside text-sm text-slate-800 dark:text-slate-100"></ul>
        </section>

        <!-- ====== Action Buttons ====== -->
        <footer id="actionButtons" class="hidden flex justify-between pt-4 relative">
            <div class="relative">
                <button onclick="toggleDropdown('downloadMenu')" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 transition">Download ▼</button>
                <div id="downloadMenu" class="absolute bottom-full mb-2 hidden bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg z-10">
                    <button onclick="downloadCSV()" class="block px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 w-full text-left text-slate-800 dark:text-slate-100">CSV</button>
                    <button onclick="downloadPDF()" class="block px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 w-full text-left text-slate-800 dark:text-slate-100">PDF</button>
                </div>
            </div>

            <div class="relative">
                <button onclick="toggleDropdown('shareMenu')" class="bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg px-4 py-2 transition">Share ▼</button>
                <div id="shareMenu" class="absolute bottom-full mb-2 left-1/2 transform -translate-x-[60%] hidden bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg z-10 w-56 p-4 space-y-3">
                    <button onclick="generateShareLink()" class="block w-full text-left text-slate-800 dark:text-slate-100 hover:underline">Copy Share Link</button>
                    <button onclick="showQRCode()" class="block w-full text-left text-slate-800 dark:text-slate-100 hover:underline">Show QR</button>
                    <canvas id="qrCodeCanvas" class="mx-auto hidden mt-3"></canvas>
                </div>
            </div>
        </footer>

    </main>

    <!-- ====== Developed & Customized by PRIYANSHU KESHARWANI ====== -->

    <script>
        let names = [];
        let currentShareLink = "";

        // Theme setup
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 z-50 rounded-lg bg-emerald-600 text-white px-4 py-2 shadow-lg';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity');
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        }

        function decrementPeople() {
            const input = document.getElementById('peopleCount');
            const val = Math.max(1, parseInt(input.value || '1', 10) - 1);
            input.value = val;
        }
        function incrementPeople() {
            const input = document.getElementById('peopleCount');
            const val = Math.max(1, parseInt(input.value || '0', 10) + 1);
            input.value = val;
        }

        function toggleDropdown(id) {
            document.getElementById('downloadMenu').classList.add('hidden');
            document.getElementById('shareMenu').classList.add('hidden');
            document.getElementById(id).classList.toggle('hidden');
        }

        function generateNameInputs() {
            const count = parseInt(document.getElementById('peopleCount').value);
            const nameFields = document.getElementById('nameFields');
            nameFields.innerHTML = '';
            for (let i = 0; i < count; i++) {
                nameFields.innerHTML += `<input type="text" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/70" placeholder="Person ${i + 1} Name" required>`;
            }
            document.getElementById('namesForm').classList.remove('hidden');
            document.getElementById('namesForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function generatePurposeInputs() {
            const inputs = document.querySelectorAll('#nameFields input');
            names = [];
            inputs.forEach(input => names.push(input.value.trim() || "Unnamed Person"));
            document.getElementById('purposeFields').innerHTML = '';
            addPurposeBox();
            document.getElementById('paymentForm').classList.remove('hidden');
            document.getElementById('paymentForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function addPurposeBox() {
            const purposeFields = document.getElementById('purposeFields');
            const box = document.createElement('div');
            box.className = "border border-slate-200 dark:border-slate-700 rounded-xl p-3 bg-slate-50 dark:bg-slate-800";

            let html = `<div class="flex items-center mb-2">
            <input type="text" class="flex-1 border border-slate-300 dark:border-slate-700 rounded-lg p-2 mr-2 purpose bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/70" placeholder="Purpose e.g. Food, Travel" required>
            <select class="category border border-slate-300 dark:border-slate-700 rounded-lg p-2 mr-2 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/70">
                <option value="Food">Food 🍽️</option>
                <option value="Travel">Travel 🚗</option>
                <option value="Shopping">Shopping 🛍️</option>
                <option value="Hotel">Hotel 🏨</option>
                <option value="Other">Other ✏️</option>
            </select>
            <button type="button" onclick="removePurpose(this)" class="text-red-600 hover:text-red-700 text-xl">🗑️</button>
            </div><div class="grid grid-cols-${names.length} gap-2">`;

            names.forEach(name => {
                html += `<input type="number" class="w-full border border-slate-300 dark:border-slate-700 rounded-lg p-2 amount bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/70" placeholder="${name} paid" required>`;
            });

            html += `</div><div class="mb-2"><label class="font-semibold text-slate-800 dark:text-slate-100">Who is involved?</label><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-1 involved">`;
            names.forEach((name, idx) => {
                html += `<label class="flex items-center gap-2 text-slate-800 dark:text-slate-100"><input type="checkbox" data-idx="${idx}" checked> ${name}</label>`;
            });

            box.innerHTML = html;
            purposeFields.appendChild(box);
            updateCategoryFilter();
        }

        function removePurpose(btn) {
            btn.closest('.border').remove();
            updateCategoryFilter();
            calculateSettlement();
        }

        function updateCategoryFilter() {
            const filter = document.getElementById('categoryFilter');
            const categories = Array.from(document.querySelectorAll('.category')).map(c => c.value);
            const unique = [...new Set(categories)];
            filter.innerHTML = `<option value="all">All Categories</option>`;
            unique.forEach(c => {
                filter.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        function showResult() {
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('actionButtons').classList.remove('hidden');
            calculateSettlement();
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function calculateSettlement() {
            const currency = document.getElementById('currency').value;
            const selectedCategory = document.getElementById('categoryFilter').value;
            let totals = Array(names.length).fill(0);
            let shares = Array(names.length).fill(0);

            document.querySelectorAll('#purposeFields > div').forEach(p => {
                const category = p.querySelector('.category').value;
                if (selectedCategory !== "all" && category !== selectedCategory) return;

                const involved = [...p.querySelectorAll('.involved input')].filter(c => c.checked).map(c => parseInt(c.dataset.idx));
                const amounts = [...p.querySelectorAll('.amount')].map(a => parseFloat(a.value) || 0);
                const totalPaid = amounts.reduce((a, b) => a + b, 0);
                involved.forEach(i => shares[i] += totalPaid / involved.length);
                amounts.forEach((amt, i) => totals[i] += amt);
            });

            const tbody = document.querySelector('#settlementTable tbody');
            tbody.innerHTML = '';
            const totalAllPaid = totals.reduce((a, b) => a + b, 0);
            document.getElementById('totalPaid').innerHTML = `<p>Total Paid: <strong>${currency}${totalAllPaid.toFixed(2)}</strong></p>`;

            let balances = [];
            names.forEach((name, idx) => {
                const diff = totals[idx] - shares[idx];
                balances.push({ name: name, amount: diff });
                const bal = diff > 0 ? `+${diff.toFixed(2)}` : diff < 0 ? `-${Math.abs(diff).toFixed(2)}` : '0';
                const status = diff > 0 ? '(Gets)' : diff < 0 ? '(Owes)' : '(Settled)';
                const color = diff > 0 ? 'text-green-700 dark:text-green-400' : diff < 0 ? 'text-red-700 dark:text-red-400' : 'text-slate-600 dark:text-slate-300';
                tbody.innerHTML += `<tr><td class="border border-slate-200 dark:border-slate-700 p-2">${name}</td><td class="border border-slate-200 dark:border-slate-700 p-2">${currency}${totals[idx].toFixed(2)}</td><td class="border border-slate-200 dark:border-slate-700 p-2">${currency}${shares[idx].toFixed(2)}</td><td class="border border-slate-200 dark:border-slate-700 p-2 ${color}">${currency}${bal} ${status}</td></tr>`;
            });

            calculateOwed(balances, currency);
        }

        function calculateOwed(balances, currency) {
            let owedList = document.getElementById('owedList');
            owedList.innerHTML = '';

            let debtors = balances.filter(b => b.amount < 0).sort((a, b) => a.amount - b.amount);
            let creditors = balances.filter(b => b.amount > 0).sort((a, b) => b.amount - a.amount);

            debtors.forEach(debtor => {
                let owe = -debtor.amount;
                for (let i = 0; i < creditors.length && owe > 0; i++) {
                    if (creditors[i].amount === 0) continue;
                    let pay = Math.min(owe, creditors[i].amount);
                    owedList.innerHTML += `<li>${debtor.name} owes ${currency}${pay.toFixed(2)} to ${creditors[i].name}</li>`;
                    owe -= pay;
                    creditors[i].amount -= pay;
                }
            });
        }

        function downloadCSV() {
            let csv = "=== Purpose Summary ===\nPurpose,Category,Paid By,Who is Involved\n";
            document.querySelectorAll('#purposeFields > div').forEach(p => {
                const purpose = p.querySelector('.purpose').value;
                const category = p.querySelector('.category').value;
                let paidBy = "";
                [...p.querySelectorAll('.amount')].forEach((amt, idx) => {
                    const val = parseFloat(amt.value) || 0;
                    if (val > 0) {
                        paidBy += `${names[idx]}: ${val}, `;
                    }
                });
                paidBy = paidBy.slice(0, -2);
                let involved = [...p.querySelectorAll('.involved input')].filter(c => c.checked).map(c => names[c.dataset.idx]).join(", ");
                csv += `${purpose},${category},"${paidBy}","${involved}"\n`;
            });
            csv += "\n=== Final Settlement ===\nName,Paid,Share,Balance\n";
            document.querySelectorAll('#settlementTable tbody tr').forEach(row => {
                csv += [...row.children].map(td => td.textContent).join(",") + "\n";
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'bill-settlement.csv';
            link.click();
            showToast('CSV downloaded');
        }

        function downloadPDF() {
            const currency = document.getElementById('currency').value;
            const element = document.createElement('div');
            element.style.padding = "20px";
            element.style.fontFamily = "Arial, sans-serif";
            element.style.fontSize = "12px";
            let purposeTable = `
            <h3 style="margin-bottom:10px;">Purpose Summary</h3>
            <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
                <thead>
                    <tr style="background:#f3f4f6;">
                        <th style="border:1px solid #ccc; padding:6px;">Purpose</th>
                        <th style="border:1px solid #ccc; padding:6px;">Category</th>
                        <th style="border:1px solid #ccc; padding:6px;">Paid By</th>
                        <th style="border:1px solid #ccc; padding:6px;">Who is Involved</th>
                    </tr>
                </thead>
                <tbody>`;
            document.querySelectorAll('#purposeFields > div').forEach(p => {
                const purpose = p.querySelector('.purpose').value;
                const category = p.querySelector('.category').value;
                let paidBy = "";
                [...p.querySelectorAll('.amount')].forEach((amt, idx) => {
                    const val = parseFloat(amt.value) || 0;
                    if (val > 0) {
                        paidBy += `${names[idx]}: ${currency}${val}, `;
                    }
                });
                paidBy = paidBy.slice(0, -2);
                let involved = [...p.querySelectorAll('.involved input')].filter(c => c.checked).map(c => names[c.dataset.idx]).join(", ");
                purposeTable += `<tr>
                    <td style="border:1px solid #ccc; padding:6px;">${purpose}</td>
                    <td style="border:1px solid #ccc; padding:6px;">${category}</td>
                    <td style="border:1px solid #ccc; padding:6px;">${paidBy}</td>
                    <td style="border:1px solid #ccc; padding:6px;">${involved}</td>
                </tr>`;
            });
            purposeTable += `</tbody></table>`;
            element.innerHTML = `
                <h2 style="text-align:center; color:#16a34a; font-size:20px; margin-bottom:10px;">Group Bill Settlement Report</h2>
                <p style="text-align:center; margin-bottom:20px;">Currency: ${currency}</p>
                ${purposeTable}
                <h3 style="margin-bottom:10px;">Final Settlement</h3>
                <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
                    <thead>
                        <tr style="background:#f3f4f6;">
                            <th style="border:1px solid #ccc; padding:8px;">Person</th>
                            <th style="border:1px solid #ccc; padding:8px;">Paid</th>
                            <th style="border:1px solid #ccc; padding:8px;">Share</th>
                            <th style="border:1px solid #ccc; padding:8px;">Balance</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${document.querySelector('#settlementTable tbody').innerHTML}
                    </tbody>
                </table>
                <h3 style="margin-bottom:10px;">Who Owes Whom:</h3>
                <ul style="padding-left:15px;">
                    ${document.getElementById('owedList').innerHTML}
                </ul>`;
            const opt = {
                margin: 0.5,
                filename: 'Group-Bill-Settlement.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
            showToast('PDF generated');
        }

        function generateShareLink() {
            const link = window.location.href;
            navigator.clipboard.writeText(link);
            showToast('Link copied to clipboard');
        }

        function showQRCode() {
            const canvas = document.getElementById('qrCodeCanvas');
            const qr = new QRious({
                element: canvas,
                value: window.location.href,
                size: 150
            });
            canvas.classList.remove('hidden');
        }

        document.addEventListener('click', function (event) {
            if (!event.target.closest('#downloadMenu') &&
                !event.target.closest('#shareMenu') &&
                !event.target.closest('[onclick^="toggleDropdown"]')) {
                document.getElementById('downloadMenu').classList.add('hidden');
                document.getElementById('shareMenu').classList.add('hidden');
            }
        }
    );
    </script>
</body>

</html>
